<script src="{{ static('libs/featherlight/featherlight.min.js') }}" type="text/javascript"></script>
{% compress js %}
    {{ comment_form.media.js }}
    <script type="text/javascript">
        function rename_martor_widget(widget, old_name, new_name) {
            function rename_data(data_name, prefix) {
                widget.find('[data-' + data_name + '=' + prefix + old_name + ']')
                      .data(data_name, prefix + new_name)
                      .attr('data-' + data_name, prefix + new_name);
            }
            function rename_id(prefix) {
                widget.find('#' + prefix + old_name).prop('id', prefix + new_name);
            }
            function rename_class(prefix) {
                widget.find('.' + prefix + old_name).removeClass(prefix + old_name).addClass(prefix + new_name);
            }
            rename_data('tab', 'editor-tab-');
            rename_data('tab', 'preview-tab-');
            rename_data('field-name', '');
            rename_id('id_');
            rename_id('martor-');
            rename_class('martor-field-');
            rename_class('main-martor-');
            widget.find('.main-martor').martor();
        }

            var root = $container || $(document);
            var toolbarSvgs = {
                'editor': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>',
                'preview': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
                'bold': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>',
                'italic': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>',
                'minus': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
                'header': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M6 12h12"></path></svg>',
                'code': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
                'superscript': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l6-14M10 19L4 5"></path><path d="M15 8h4l-4 4h4"></path></svg>',
                'quote': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path></svg>',
                'unordered-list': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>',
                'ordered-list': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>',
                'linkify': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>',

                'at': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>',
                'maximize': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>',
                'help': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
            };
            function rep(sel, key) {
                root.find(sel).each(function() {
                    var $i = $(this).find('i.icon');
                    if ($i.length) {
                        var $span = $('<span class="vector-icon-wrap"></span>').css({
                            'display': 'inline-flex',
                            'align-items': 'center',
                            'justify-content': 'center',
                            'width': '16px',
                            'height': '16px',
                            'vertical-align': 'middle'
                        }).html(toolbarSvgs[key]);
                        $i.replaceWith($span);
                    }
                });
            }
            rep('a[data-tab^="editor-tab-"]', 'editor');
            rep('a[data-tab^="preview-tab-"]', 'preview');
            rep('.markdown-bold', 'bold');
            rep('.markdown-italic', 'italic');
            rep('.markdown-horizontal', 'minus');
            rep('.ui.dropdown[title="Heading"]', 'header');
            rep('.ui.dropdown[title="Pre or Code"]', 'code');
            rep('.ui.dropdown[title="Math"]', 'superscript');
            rep('.markdown-blockquote', 'quote');
            rep('.markdown-unordered-list', 'unordered-list');
            rep('.markdown-ordered-list', 'ordered-list');
            rep('.markdown-link', 'linkify');
            rep('.markdown-image-link', 'image');
            rep('.markdown-direct-mention', 'at');
            rep('.markdown-toggle-maximize', 'maximize');
            rep('.markdown-help', 'help');
        }

        $(document).ready(function () {
            vectorize_martor_icons();

            window.reply_comment = function (parent) {
                var $comment_reply = $('#comment-' + parent + '-reply');
                var reply_id = 'reply-' + parent;
                if ($comment_reply.find('#' + reply_id).length == 0) {
                    var $reply_form = $('#new-comment').clone(false).prop('id', reply_id);
                    $reply_form.find('h3').html({{ _('Replying to comment')|htmltojs }});
                    $reply_form.prepend('<a class="close">x</a>');
                    $reply_form.appendTo($comment_reply);
                    $reply_form.find('form.comment-submit-form input#id_parent').val(parent);
                    rename_martor_widget($reply_form, 'body', reply_id);
                    ace.edit('martor-' + reply_id).setValue('');
                    vectorize_martor_icons($reply_form);
                }
                $comment_reply.fadeIn();

                $('html, body').animate({
                    scrollTop: $comment_reply.offset().top - $('#navigation').height() - 4
                }, 500);
            };

            $(document).on('click', '.close', function() {
                $(this).closest('.reply-comment').fadeOut();
            });

            function update_math($comment) {
                if ('MathJax' in window) {
                    var $body = $comment.find('.comment-body');
                    MathJax.typesetPromise([$body[0]]).then(function () {
                        $body.find('.tex-image').hide();
                        $body.find('.tex-text').show();
                    });
                }
            }

            window.show_revision = function (comment_id, offset) {
                var $comment = $("#comment-" + comment_id);

                // If .comment-body is hidden, then this is a bad comment that the user has not clicked
                // Thus the revision retrieval should do nothing
                if (!$comment.find('.comment-body').is(':visible'))
                    return;

                var cur_revision = parseInt($comment.attr("data-revision"));
                var max_revision = parseInt($comment.attr("data-max-revision"));
                var revision_ajax = $comment.attr("data-revision-ajax");
                var show_revision = cur_revision + offset;

                // Do nothing if desired revision is out of bounds
                if (show_revision < 0 || show_revision > max_revision)
                    return;

                $comment.attr("data-revision", show_revision);

                $.get(revision_ajax, {
                    revision: show_revision
                }).done(function (body) {
                    $comment.find('.previous-revision').css({visibility: show_revision == 0 ? 'hidden' : ''});
                    $comment.find('.next-revision').css({visibility: show_revision == max_revision ? 'hidden' : ''});
                    var $content = $comment.find('.content').html(body);

                    var edit_text = {{ _('edit {edits}')|htmltojs }}.replace('{edits}', show_revision);

                    if (show_revision == 0) {
                        edit_text = {{ _('original')|htmltojs }};
                    } else if (show_revision == max_revision && max_revision == 1) {
                        edit_text = {{ _('edited')|htmltojs }};
                    }

                    $comment.find('.comment-edit-text').text(' ' + edit_text + ' ');
                    update_math($content);
                    if (window.add_code_copy_buttons)
                        window.add_code_copy_buttons($content);
                });
            };

            function ajax_vote(url, id, delta, on_success) {
                return $.ajax({
                    url: url,
                    type: 'POST',
                    data: {
                        id: id
                    },
                    success: function (data, textStatus, jqXHR) {
                        var score = $('#comment-' + id + ' .comment-score').first();
                        score.text(parseInt(score.text()) + delta);
                        if (typeof on_success !== 'undefined')
                            on_success();
                    },
                    error: function (data, textStatus, jqXHR) {
                        alert({{ _('Could not vote: {error}')|htmltojs }}.replace('{error}', data.responseText));
                    }
                });
            }

            var get_$votes = function (id) {
                var $comment = $('#comment-' + id);
                return {
                    upvote: $comment.find('.upvote-link').first(),
                    downvote: $comment.find('.downvote-link').first()
                };
            };

            window.comment_upvote = function (id) {
                ajax_vote('{{ url('comment_upvote') }}', id, 1, function () {
                    var $votes = get_$votes(id);
                    if ($votes.downvote.hasClass('voted'))
                        $votes.downvote.removeClass('voted');
                    else
                        $votes.upvote.addClass('voted');
                });
            };

            window.comment_downvote = function (id) {
                ajax_vote('{{ url('comment_downvote') }}', id, -1, function () {
                    var $votes = get_$votes(id);
                    if ($votes.upvote.hasClass('voted'))
                        $votes.upvote.removeClass('voted');
                    else
                        $votes.downvote.addClass('voted');
                });
            };

            var $comments = $('.comments');
            $comments.find('a.hide-comment').click(function (e) {
                e.preventDefault();
                if (!(e.ctrlKey || e.metaKey || confirm({{ _('Are you sure you want to hide this comment?')|htmltojs }})))
                    return;

                var id = $(this).attr('data-id');
                $.post('{{ url('comment_hide') }}', {id: id}).then(function () {
                    $('#comment-' + id).remove();
                    $('#comment-' + id + '-children').remove();
                }).catch(function () {
                    alert({{ _('Could not hide comment.')|htmltojs }});
                });
            });

            $comments.find('a.edit-link').featherlight({
                afterOpen: function () {
                    var $widget = $('.featherlight #comment-form-body');
                    rename_martor_widget($widget, 'body', 'edit');
                    vectorize_martor_icons($('.featherlight'));
                    $('#comment-edit').submit(function (event) {
                        event.preventDefault();
                        var id = $('#comment-edit').find('.comment-id').text();
                        var readback = $('#comment-edit').find('.read-back').text();
                        $.post($(this).attr('action'), $(this).serialize()).done(function (data) {
                            $.featherlight.current().close();
                            $.ajax({
                                url: readback
                            }).done(function (data) {
                                var $comment = $('#comment-' + id);
                                var $area = $comment.find('.comment-body').first();
                                $area.html(data);
                                update_math($comment);
                                if (window.add_code_copy_buttons)
                                    window.add_code_copy_buttons($area);
                                var $edits = $comment.find('.comment-edits').first();
                                $edits.text({{ _('updated')|htmltojs }});
                            }).fail(function () {
                                alert({{ _('Failed to update comment body.')|htmltojs }});
                            });
                        }).fail(function (data) {
                            alert({{ _('Could not edit comment: {error}')|htmltojs }}.replace('{error}', data.responseText));
                        });
                    });
                },
                variant: 'featherlight-edit'
            });

            $('votes-link').find('a[data-featherlight]').featherlight();

            var $root = $('html, body');
            $comments.find('a.comment-link').click(function () {
                var href = $.attr(this, 'href');
                $root.animate({
                    scrollTop: $(href).offset().top
                }, 500, function () {
                    window.location.hash = href;
                });
                return false;
            });

            $('img.unveil').unveil(200);

            window.comment_show_content = function (comment_id) {
                var $comment = $('#comment-' + comment_id);
                $comment.find('.comment-body').show();
                $comment.find('.bad-comment-body').hide();
            };

            var code_regex = [/input\(/, /#include/, /void\s+main/, /fn\s+main/, /func\s+main/];
            $(document).on('click', 'form.comment-warn-code .button[type=submit]', function (e) {
                var text = $(this).parents('form').find('#id_body').val();
                if (code_regex.some(function (regex) {return regex.test(text);})) {
                    if (!confirm({{ _('Looks like you\'re trying to post some source code!\n\nThe comment section is not for posting source code.\nIf you want to submit your solution, please use the "Submit solution" button.\n\nAre you sure you want to post this?')|htmltojs }})) {
                        e.preventDefault();
                    }
                }
            });
        });
    </script>
{% endcompress %}
